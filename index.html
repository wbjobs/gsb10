<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音频指纹重复检测</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header>
  <h1>音频指纹重复检测</h1>
  <div id="stats-bar">
    <span id="stat-songs">曲目 0</span>
    <span id="stat-entries">指纹 0</span>
    <span id="stat-index">索引 0 MB</span>
    <span id="stat-heap">堆内存 --</span>
    <span id="stat-query">上次比对 --</span>
  </div>
</header>
<main>
  <section class="panel" id="library-panel">
    <div class="panel-head">
      <h2>指纹曲库</h2>
      <div class="actions">
        <button id="btn-import">导入音频</button>
        <button id="btn-scan">扫描库内重复</button>
        <button id="btn-clear" class="danger">清空曲库</button>
        <input type="file" id="file-import" accept="audio/*" multiple hidden>
      </div>
    </div>
    <div id="import-status" class="status"></div>
    <table id="song-table">
      <thead>
        <tr><th>#</th><th>名称</th><th>时长</th><th>指纹数</th><th>入库时间</th><th></th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <div id="scan-results"></div>
  </section>

  <section class="panel" id="query-panel">
    <div class="panel-head">
      <h2>重复检测</h2>
      <div class="actions">
        <button id="btn-query-file">选择音频查询</button>
        <button id="btn-record-query">录音查询</button>
        <button id="btn-record-add">录音入库</button>
        <input type="file" id="file-query" accept="audio/*" hidden>
      </div>
    </div>
    <div id="query-status" class="status"></div>
    <div id="results"></div>
    <div id="compare-view">
      <canvas id="wave-query" width="860" height="120"></canvas>
      <canvas id="wave-song" width="860" height="120"></canvas>
    </div>
  </section>
</main>
<script src="js/dsp.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
